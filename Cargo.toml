[package]
name = "orbisys"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Maintenance et administration d'un système Linux dans une seule application"
repository = "https://github.com/aelharrak/orbisys"

[lib]
name = "orbisys"
path = "src/lib.rs"

[[bin]]
name = "orbisys"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
